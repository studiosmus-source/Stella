name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/cmdline-tools/latest/bin/
          ls $ANDROID_HOME/platforms/ || echo "(no platforms yet)"
          ls $ANDROID_HOME/build-tools/ || echo "(no build-tools yet)"

      - name: Install Android SDK platform 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Show last 80 lines on failure
        if: failure()
        run: grep -E "error:|Error|FAILED|Exception" build.log | head -40 || tail -80 build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LivingWeather-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
