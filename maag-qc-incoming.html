<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>MAAG QC Incoming - Gestione NC</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f3f2f1; color: #323130; margin: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 25px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }

        .header-title { display: flex; align-items: center; border-bottom: 2px solid #e8a020; padding-bottom: 10px; margin-bottom: 20px; }
        h2 { color: #e8a020; margin: 0; font-size: 22px; }
        h3 { color: #2b2b2b; margin-top: 20px; margin-bottom: 12px; font-size: 16px; border-left: 4px solid #e8a020; padding-left: 8px; }

        .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; background: #f9f9f9; padding: 20px; border-radius: 4px; border: 1px solid #e1dfdd; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 13px; font-weight: bold; color: #323130; margin-bottom: 6px; }
        .form-group input { padding: 10px; border: 1px solid #a19f9d; border-radius: 4px; font-size: 13px; background: white; }

        .btn-container { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; margin-bottom: 30px; }
        .btn-save  { background-color: #e8a020; color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-save:hover  { background-color: #c8881a; }

        .toast { display: none; background: #107c41; color: white; padding: 10px 18px; border-radius: 4px; font-weight: bold; font-size: 13px; align-items: center; }

        table { width: 100%; border-collapse: collapse; background: white; margin-top: 10px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #edebe9; font-size: 13px; }
        th { background-color: #f3f2f1; color: #323130; font-weight: 600; border-bottom: 2px solid #8a8886; }

        .status-alert { background-color: #fde7e9; color: #a80000; font-weight: bold; padding: 5px 10px; border-radius: 4px; border: 1px solid #f3b0b3; display: inline-block; font-size: 12px; }
        .status-ok    { background-color: #dff6dd; color: #107c41; font-weight: bold; padding: 5px 10px; border-radius: 4px; border: 1px solid #92c390; display: inline-block; font-size: 12px; }

        .btn-done { background-color: #107c41; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-pdf  { background-color: #333; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; margin-right: 4px; }
        .btn-del  { background-color: #a80000; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 4px; }

        .row-done { opacity: 0.4; }
        .no-fade  { opacity: 1 !important; }

        #printArea { display: none; }

        @media print {
            body { background: white; margin: 0; padding: 0; font-family: Arial, sans-serif; }
            .container { display: none !important; }
            #printArea { display: block !important; padding: 28px 36px; }

            .ph-logo-box { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
            .ph-arrow { width: 0; height: 0; border-top: 22px solid transparent; border-bottom: 22px solid transparent; border-left: 28px solid #e8a020; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .ph-maag { font-size: 28px; font-weight: 900; color: #1a1a1a; letter-spacing: -1px; }
            .ph-brands { font-size: 7px; color: #555; line-height: 1.7; margin-left: 14px; margin-top: 2px; }
            .ph-brands b { color: #1a1a1a; }

            .ph-title    { text-align: center; font-size: 32px; font-weight: 900; font-style: italic; color: #1a1a1a; margin: 0 0 4px; }
            .ph-subtitle { text-align: center; font-size: 20px; font-weight: 700; color: #2e6db4; margin: 0 0 16px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .ph-hr { border: none; border-top: 1px solid #aaa; margin-bottom: 26px; }

            .ph-field { display: flex; align-items: flex-end; margin-bottom: 17px; }
            .ph-label { font-size: 13px; width: 210px; flex-shrink: 0; padding-bottom: 3px; }
            .ph-value { flex: 1; border-bottom: 1px solid #333; min-height: 20px; padding: 0 0 2px 6px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h2>▶ MAAG — QC Incoming: Gestione NC</h2>
    </div>

    <h3>📋 Compilazione Dati Non Conformità</h3>
    <div class="form-grid">
        <div class="form-group"><label>NC:</label><input type="text" id="nc_num" placeholder="Es. 2026-045"></div>
        <div class="form-group"><label>Fornitore:</label><input type="text" id="fornitore" placeholder="Inserire Fornitore"></div>
        <div class="form-group"><label>N° Ordine di produzione:</label><input type="text" id="odp" placeholder="Numero Ordine Produzione"></div>
        <div class="form-group"><label>SAP Grezzo:</label><input type="text" id="sap_grezzo" placeholder="Codice SAP Grezzo"></div>
        <div class="form-group"><label>SAP Finito:</label><input type="text" id="sap_finito" placeholder="Codice SAP Finito"></div>
        <div class="form-group"><label>Ordine di acquisto:</label><input type="text" id="oda" placeholder="Numero Ordine Acquisto"></div>
        <div class="form-group"><label>Posizione:</label><input type="text" id="posizione" placeholder="Posizione Ordine"></div>
        <div class="form-group"><label>Colata:</label><input type="text" id="colata" placeholder="Numero Colata"></div>
        <div class="form-group"><label>Quantità Fornita:</label><input type="text" id="q_fornita" placeholder="Pezzi / Peso Forniti"></div>
        <div class="form-group"><label>Quantità Scarto:</label><input type="text" id="q_scarto" placeholder="Pezzi / Peso Scartati"></div>
        <div class="form-group"><label>Numero Fattura:</label><input type="text" id="n_fattura" placeholder="Numero Fattura"></div>
        <div class="form-group"><label>Data Fattura:</label><input type="text" id="data_fattura" placeholder="GG/MM/AAAA"></div>
        <div class="form-group"><label>Intercettazione:</label><input type="text" id="intercettazione" placeholder="Es. Controllo Ingressi"></div>
        <div class="form-group"><label>Ordine Cliente:</label><input type="text" id="ordine_cliente" placeholder="Riferimento Cliente"></div>
        <div class="form-group"><label>Posizione Cliente:</label><input type="text" id="posizione_cliente" placeholder="Posizione Ordine Cliente"></div>
    </div>

    <div class="btn-container">
        <div class="toast" id="toast">✔ Salvato nel registro</div>
        <button class="btn-save" onclick="aggiungiNC()">+ Aggiungi al Registro</button>
    </div>

    <h3>🔍 Registro Attività</h3>
    <table>
        <thead>
            <tr>
                <th>Data</th>
                <th>NC</th>
                <th>Fornitore</th>
                <th>SAP / Ordine</th>
                <th>Stato</th>
                <th style="width:220px;">Azioni</th>
            </tr>
        </thead>
        <tbody id="tabellaCorpo"></tbody>
    </table>
</div>

<!-- Area visibile solo in stampa -->
<div id="printArea"></div>

<script>
    document.addEventListener("DOMContentLoaded", mostraRegistro);

    function leggi(id) { return document.getElementById(id).value.trim() || "-"; }

    function aggiungiNC() {
        const fornitore = document.getElementById('fornitore').value.trim();
        if (!fornitore) { alert("Il campo Fornitore è obbligatorio."); return; }

        const nc = {
            id:                Date.now(),
            data_inserimento:  new Date().toLocaleDateString('it-IT'),
            nc_num:            leggi('nc_num'),
            fornitore:         fornitore,
            odp:               leggi('odp'),
            sap_grezzo:        leggi('sap_grezzo'),
            sap_finito:        leggi('sap_finito'),
            oda:               leggi('oda'),
            posizione:         leggi('posizione'),
            colata:            leggi('colata'),
            q_fornita:         leggi('q_fornita'),
            q_scarto:          leggi('q_scarto'),
            n_fattura:         leggi('n_fattura'),
            data_fattura:      leggi('data_fattura'),
            intercettazione:   leggi('intercettazione'),
            ordine_cliente:    leggi('ordine_cliente'),
            posizione_cliente: leggi('posizione_cliente'),
            stato: "PENDENTE"
        };

        let db = JSON.parse(localStorage.getItem('db_maag_nc')) || [];
        db.push(nc);
        localStorage.setItem('db_maag_nc', JSON.stringify(db));

        mostraRegistro();
        mostraToast();
        document.querySelectorAll('.form-grid input').forEach(el => el.value = '');
    }

    function mostraToast() {
        const t = document.getElementById('toast');
        t.style.display = 'flex';
        setTimeout(() => t.style.display = 'none', 2500);
    }

    function mostraRegistro() {
        const db = JSON.parse(localStorage.getItem('db_maag_nc')) || [];
        const tbody = document.getElementById('tabellaCorpo');
        tbody.innerHTML = '';
        db.sort((a, b) => (a.stato === 'PENDENTE' ? -1 : 1));

        db.forEach(item => {
            const tr = document.createElement('tr');
            if (item.stato === 'TERMINATA') tr.className = 'row-done';

            const datiSicuri = encodeURIComponent(JSON.stringify(item));

            tr.innerHTML = `
                <td>${item.data_inserimento}</td>
                <td><strong>${item.nc_num}</strong></td>
                <td>${item.fornitore}</td>
                <td style="font-size:12px;">
                    G: ${item.sap_grezzo} | F: ${item.sap_finito}<br>
                    ODA: ${item.oda} — Pos: ${item.posizione}
                </td>
                <td>
                    <span class="${item.stato === 'PENDENTE' ? 'status-alert' : 'status-ok'} no-fade">
                        ${item.stato === 'PENDENTE' ? '● In Attesa' : '✔ Terminata'}
                    </span>
                </td>
                <td class="no-fade">
                    <button class="btn-pdf"  onclick="apriPDF('${datiSicuri}')">⬇️ PDF</button>
                    ${item.stato === 'PENDENTE'
                        ? `<button class="btn-done" onclick="chiudi(${item.id})">✔ Fatto</button>`
                        : ''}
                    <button class="btn-del" onclick="elimina(${item.id})">🗑</button>
                </td>`;
            tbody.appendChild(tr);
        });
    }

    function chiudi(id) {
        let db = JSON.parse(localStorage.getItem('db_maag_nc'));
        db = db.map(x => x.id === id ? {...x, stato: 'TERMINATA'} : x);
        localStorage.setItem('db_maag_nc', JSON.stringify(db));
        mostraRegistro();
    }

    function elimina(id) {
        if (!confirm("Rimuovere questa NC dal registro?")) return;
        let db = JSON.parse(localStorage.getItem('db_maag_nc'));
        db = db.filter(x => x.id !== id);
        localStorage.setItem('db_maag_nc', JSON.stringify(db));
        mostraRegistro();
    }

    /* ── PDF ── */
    function apriPDF(encoded) {
        const d = JSON.parse(decodeURIComponent(encoded));
        costruisciPDF(d);
        // Piccolo ritardo per garantire che il DOM sia aggiornato prima della stampa
        setTimeout(() => window.print(), 150);
    }

    function campo(label, valore) {
        const testo = (!valore || valore === '-') ? '' : valore;
        return `<div class="ph-field">
                    <div class="ph-label">${label}</div>
                    <div class="ph-value">${testo}</div>
                </div>`;
    }

    function costruisciPDF(d) {
        document.getElementById('printArea').innerHTML = `
            <div class="ph-logo-box">
                <div class="ph-arrow"></div>
                <div class="ph-maag">MAAG</div>
                <div class="ph-brands">
                    PUMP &amp; FILTRATION SYSTEMS &nbsp;▸&nbsp; PELLETIZING &amp; PULVERIZING SYSTEMS &nbsp;▸&nbsp; RECYCLING SYSTEMS &nbsp;▸&nbsp; MEASUREMENT &amp; CONTROL SYSTEMS<br>
                    <b>MAAG &nbsp; WITTE &nbsp; GALA &nbsp; SCHEER &nbsp; AMN &nbsp; ETTLINGER &nbsp; SIKORA &nbsp; XANTEC</b><br>
                    REDUCTION &nbsp; AUTOMATIK
                </div>
            </div>
            <div class="ph-title">QC Incoming</div>
            <div class="ph-subtitle">Gestione NC</div>
            <hr class="ph-hr">
            ${campo('NC:', d.nc_num)}
            ${campo('N° Ordine di produzione:', d.odp)}
            ${campo('SAP Grezzo:', d.sap_grezzo)}
            ${campo('SAP Finito:', d.sap_finito)}
            ${campo('Ordine di acquisto:', d.oda)}
            ${campo('Posizione:', d.posizione)}
            ${campo('Colata:', d.colata)}
            ${campo('Fornitore:', d.fornitore)}
            ${campo('Quantità Fornita:', d.q_fornita)}
            ${campo('Quantità Scarto:', d.q_scarto)}
            ${campo('Numero Fattura:', d.n_fattura)}
            ${campo('Data Fattura:', d.data_fattura)}
            ${campo('Intercettazione:', d.intercettazione)}
            ${campo('Ordine Cliente:', d.ordine_cliente)}
            ${campo('Posizione Cliente:', d.posizione_cliente)}
        `;
    }
</script>

</body>
</html>
