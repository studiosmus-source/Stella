<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>MAAG QC Incoming - Gestione NC</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f2f1; color: #323130; margin: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 25px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }

        .header-title { border-bottom: 2px solid #e8a020; padding-bottom: 14px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 6px; }
        .header-title img { height: 48px; width: auto; }
        h2 { color: #e8a020; margin: 0; font-size: 22px; }
        h3 { color: #2b2b2b; margin-top: 20px; margin-bottom: 12px; font-size: 16px; border-left: 4px solid #e8a020; padding-left: 8px; }

        .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; background: #f9f9f9; padding: 20px; border-radius: 4px; border: 1px solid #e1dfdd; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 13px; font-weight: bold; color: #323130; margin-bottom: 6px; }
        .form-group input { padding: 10px; border: 1px solid #a19f9d; border-radius: 4px; font-size: 13px; }

        .btn-container { text-align: right; margin-top: 20px; margin-bottom: 30px; }
        .btn-save { background-color: #e8a020; color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 14px; }

        #toast { display: none; background: #107c41; color: white; padding: 10px 18px; border-radius: 4px; font-weight: bold; font-size: 13px; margin-right: 12px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #edebe9; font-size: 13px; }
        th { background-color: #f3f2f1; font-weight: 600; border-bottom: 2px solid #8a8886; }

        .s-alert { background: #fde7e9; color: #a80000; font-weight: bold; padding: 5px 10px; border-radius: 4px; border: 1px solid #f3b0b3; font-size: 12px; display: inline-block; }
        .s-ok    { background: #dff6dd; color: #107c41; font-weight: bold; padding: 5px 10px; border-radius: 4px; border: 1px solid #92c390; font-size: 12px; display: inline-block; }

        .btn-pdf  { background: #333; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 4px; }
        .btn-done { background: #107c41; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 4px; }
        .btn-del  { background: #a80000; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        .row-done { opacity: 0.4; }
        .no-fade  { opacity: 1 !important; }

        #printArea { display: none; }

        @media print {
            body { background: white; margin: 0; padding: 0; }
            .container { display: none !important; }
            #printArea {
                display: block !important;
                padding: 28px 36px;
                font-family: Arial, sans-serif;
            }
            .ph-logo  { margin-bottom: 32px; }
            .ph-logo img { height: 56px; width: auto; }

            .ph-h1 { text-align: center; font-size: 32px; font-weight: 900; font-style: italic; margin: 0 0 4px; }
            .ph-h2 { text-align: center; font-size: 20px; font-weight: 700; color: #2e6db4; margin: 0 0 16px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .ph-hr { border: none; border-top: 1px solid #999; margin-bottom: 24px; }

            .ph-row   { display: flex; align-items: flex-end; margin-bottom: 17px; }
            .ph-label { font-size: 13px; width: 210px; flex-shrink: 0; }
            .ph-val   { flex: 1; border-bottom: 1px solid #333; min-height: 20px; padding-left: 6px; font-size: 13px; }
        }
    </style>
</head>

        <div class="form-group"><label>SAP Finito:</label>              <input type="text" id="sap_finito"        placeholder="Codice SAP Finito"></div>
        <div class="form-group"><label>Ordine di acquisto:</label>      <input type="text" id="oda"               placeholder="Numero Ordine Acquisto"></div>
        <div class="form-group"><label>Posizione:</label>               <input type="text" id="posizione"         placeholder="Posizione Ordine"></div>
        <div class="form-group"><label>Colata:</label>                  <input type="text" id="colata"            placeholder="Numero Colata"></div>
        <div class="form-group"><label>Quantit&agrave; Fornita:</label>  <input type="text" id="q_fornita"         placeholder="Pezzi / Peso Forniti"></div>
        <div class="form-group"><label>Quantit&agrave; Scarto:</label>   <input type="text" id="q_scarto"          placeholder="Pezzi / Peso Scartati"></div>
        <div class="form-group"><label>Numero Fattura:</label>          <input type="text" id="n_fattura"         placeholder="Numero Fattura"></div>
        <div class="form-group"><label>Data Fattura:</label>            <input type="text" id="data_fattura"      placeholder="GG/MM/AAAA"></div>
        <div class="form-group"><label>Intercettazione:</label>        <input type="text" id="intercettazione"   placeholder="Es. Controllo Ingressi"></div>
        <div class="form-group"><label>Ordine Cliente:</label>         <input type="text" id="ordine_cliente"    placeholder="Riferimento Cliente"></div>
        <div class="form-group"><label>Posizione Cliente:</label>      <input type="text" id="posizione_cliente" placeholder="Posizione Ordine Cliente"></div>
    </div>

    <div class="btn-container">
        <span id="toast">Salvato nel registro</span>
        <button class="btn-save" id="btnSalva">+ Aggiungi al Registro</button>
    </div>

    <h3>Registro Attivit&agrave;</h3>
    <table>
        <thead>
            <tr>
                <th>Data</th>
                <th>NC</th>
                <th>Fornitore</th>
                <th>SAP / Ordine</th>
                <th>Stato</th>
                <th style="width:220px;">Azioni</th>
            </tr>
        </thead>
        <tbody id="tabellaCorpo"></tbody>
    </table>
</div>

<div id="printArea"></div>

<script type="text/javascript">
    var DB_KEY = 'db_maag_nc';

    function leggi(id) {
        var el = document.getElementById(id);
        var val = el ? el.value.trim() : '';
        return val || '-';
    }

    function caricaDB() {
        try {
            return JSON.parse(localStorage.getItem(DB_KEY)) || [];
        } catch(e) {
            return [];
        }
    }

    function salvaDB(db) {
        try {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        } catch(e) {
            alert('Errore nel salvataggio: ' + e.message);
        }
    }

    function aggiungiNC() {
        var fornitore = document.getElementById('fornitore').value.trim();
        if (!fornitore) {
            alert('Il campo Fornitore e\' obbligatorio.');
            return;
        }

        var oggi = new Date();
        var data = oggi.getDate() + '/' + (oggi.getMonth()+1) + '/' + oggi.getFullYear();

        var nc = {
            id:                oggi.getTime(),
            data_inserimento:  data,
            nc_num:            leggi('nc_num'),
            fornitore:         fornitore,
            odp:               leggi('odp'),
            sap_grezzo:        leggi('sap_grezzo'),
            sap_finito:        leggi('sap_finito'),
            oda:               leggi('oda'),
            posizione:         leggi('posizione'),
            colata:            leggi('colata'),
            q_fornita:         leggi('q_fornita'),
            q_scarto:          leggi('q_scarto'),
            n_fattura:         leggi('n_fattura'),
            data_fattura:      leggi('data_fattura'),
            intercettazione:   leggi('intercettazione'),
            ordine_cliente:    leggi('ordine_cliente'),
            posizione_cliente: leggi('posizione_cliente'),
            stato: 'PENDENTE'
        };

        var db = caricaDB();
        db.push(nc);
        salvaDB(db);

        mostraRegistro();
        mostraToast();

        var inputs = document.querySelectorAll('.form-grid input');
        for (var i = 0; i < inputs.length; i++) {
            inputs[i].value = '';
        }
    }

    function mostraToast() {
        var t = document.getElementById('toast');
        t.style.display = 'inline-block';
        setTimeout(function() { t.style.display = 'none'; }, 2500);
    }

    function mostraRegistro() {
        var db = caricaDB();
        var tbody = document.getElementById('tabellaCorpo');
        tbody.innerHTML = '';

        db.sort(function(a, b) {
            if (a.stato === 'PENDENTE' && b.stato !== 'PENDENTE') return -1;
            if (a.stato !== 'PENDENTE' && b.stato === 'PENDENTE') return 1;
            return 0;
        });

        for (var i = 0; i < db.length; i++) {
            var item = db[i];
            var tr = document.createElement('tr');
            if (item.stato === 'TERMINATA') tr.className = 'row-done';

            var tdData    = document.createElement('td'); tdData.innerHTML = item.data_inserimento;
            var tdNC      = document.createElement('td'); tdNC.innerHTML = '<strong>' + item.nc_num + '</strong>';
            var tdForn    = document.createElement('td'); tdForn.innerHTML = item.fornitore;
            var tdSap     = document.createElement('td');
            tdSap.style.fontSize = '12px';
            tdSap.innerHTML = 'G: ' + item.sap_grezzo + ' | F: ' + item.sap_finito + '<br>ODA: ' + item.oda + ' &mdash; Pos: ' + item.posizione;

            var tdStato   = document.createElement('td');
            var span = document.createElement('span');
            span.className = (item.stato === 'PENDENTE' ? 's-alert' : 's-ok') + ' no-fade';
            span.innerHTML = item.stato === 'PENDENTE' ? 'In Attesa' : 'Terminata';
            tdStato.appendChild(span);

            var tdAzioni  = document.createElement('td');
            tdAzioni.className = 'no-fade';

            var btnPdf = document.createElement('button');
            btnPdf.className = 'btn-pdf';
            btnPdf.innerHTML = 'PDF';
            (function(d) {
                btnPdf.onclick = function() { apriPDF(d); };
            })(item);
            tdAzioni.appendChild(btnPdf);

            if (item.stato === 'PENDENTE') {
                var btnDone = document.createElement('button');
                btnDone.className = 'btn-done';
                btnDone.innerHTML = 'Fatto';
                (function(id) {
                    btnDone.onclick = function() { chiudi(id); };
                })(item.id);
                tdAzioni.appendChild(btnDone);
            }

            var btnDel = document.createElement('button');
            btnDel.className = 'btn-del';
            btnDel.innerHTML = 'Elimina';
            (function(id) {
                btnDel.onclick = function() { elimina(id); };
            })(item.id);
            tdAzioni.appendChild(btnDel);

            tr.appendChild(tdData);
            tr.appendChild(tdNC);
            tr.appendChild(tdForn);
            tr.appendChild(tdSap);
            tr.appendChild(tdStato);
            tr.appendChild(tdAzioni);
            tbody.appendChild(tr);
        }
    }

    function chiudi(id) {
        var db = caricaDB();
        for (var i = 0; i < db.length; i++) {
            if (db[i].id === id) db[i].stato = 'TERMINATA';
        }
        salvaDB(db);
        mostraRegistro();
    }

    function elimina(id) {
        if (!confirm('Rimuovere questa NC dal registro?')) return;
        var db = caricaDB();
        var nuovo = [];
        for (var i = 0; i < db.length; i++) {
            if (db[i].id !== id) nuovo.push(db[i]);
        }
        salvaDB(nuovo);
        mostraRegistro();
    }
